name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Unzip project
        run: unzip -q TVLauncher.zip
      - name: Build debug APK
        run: cd TVLauncher && gradle :app:assembleDebug --no-daemon
      - name: Zip APK
        run: |
          mkdir out
          cp TVLauncher/app/build/outputs/apk/debug/app-debug.apk out/TVLauncher.apk
          cd out && zip TVLauncher-APK.zip TVLauncher.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TVLauncher-APK
          path: out/TVLauncher-APK.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TV Launcher build ${{ github.run_number }}
          files: |
            out/TVLauncher-APK.zip
            out/TVLauncher.apk
